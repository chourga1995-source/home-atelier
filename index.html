:root{color-scheme:light;--cream:#f6f1e9;--sidebar:#f0eae0;--paper:#fffdf8;--soft:#faf6ee;--line:#e4dbcc;--ink:#25382f;--muted:#536458;--forest:#2f4a3e;--brass:#b8955a;--terra:#c27c5e;--sage:#8fa58f;--blue:#7c93a8;--focus:#906127;--shadow:0 3px 11px #45341f0a;--body:"Atelier Sans",Arial,sans-serif;--title:"Atelier Serif",Georgia,serif}
:root[data-theme="dark"]{color-scheme:dark;--cream:#1b1f23;--sidebar:#212825;--paper:#252e2a;--soft:#2c362f;--line:#415046;--ink:#f2ede3;--muted:#bbc7b9;--forest:#adc7b2;--brass:#d3af75;--focus:#e8c68c;--shadow:0 4px 15px #0002}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.55 var(--body);font-variant-numeric:tabular-nums}button,input,select,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button:disabled{opacity:.45;cursor:default}a{text-decoration:none;color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:3px}h1,h2,p,dl,dd{margin:0}h1,h2{font-family:var(--title);font-weight:400;line-height:1.14;letter-spacing:-.033em}h1{font-size:clamp(2rem,3.7vw,3.35rem)}h2{font-size:clamp(1.28rem,2.2vw,1.7rem)}p{color:var(--muted)}svg{flex:none}[hidden]{display:none!important}.muted,.small{color:var(--muted)}.small{font-size:11.5px}.sr-only,.skip:not(:focus){position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}.skip:focus{position:fixed;z-index:15;top:8px;left:8px}
.shell{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100dvh}.sidebar{height:100dvh;position:sticky;top:0;overflow:auto;scrollbar-width:thin;background:var(--sidebar);border-right:1px solid var(--line);padding:23px 16px 14px}.brand{display:flex;align-items:center;gap:11px;padding:0 4px 19px;border-bottom:1px solid var(--line);margin-bottom:16px}.brand-icon{width:43px;height:43px;border-radius:12px;background:#294337;color:#e7c88f;display:grid;place-items:center}.brand b{display:block;font:400 17px/1.15 var(--title);letter-spacing:-.035em;white-space:nowrap}.brand small{color:var(--muted);font-size:10px}.nav-group+.nav-group{margin-top:13px}.nav-group p{padding:0 10px 4px;text-transform:uppercase;letter-spacing:.11em;font-size:9.5px;font-weight:700}.nav-group a{display:flex;align-items:center;gap:9px;color:var(--muted);border-radius:8px;padding:5px 8px;min-height:31px;font-size:12px}.nav-group a:hover,.nav-group a[aria-current="page"]{background:var(--paper);color:var(--ink)}.nav-group a[aria-current="page"]{font-weight:700;box-shadow:inset 2px 0 var(--brass)}.local-note{border-top:1px solid var(--line);padding:12px 8px 0;margin-top:17px;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}
.workspace{min-width:0}.topbar{height:63px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 clamp(16px,3vw,42px);font-size:12px;color:var(--muted)}.topbar>div{display:flex;align-items:center;gap:8px}.topbar strong{color:var(--ink)}.sample-label{border-radius:999px;background:color-mix(in srgb,var(--brass) 20%,var(--paper));color:var(--ink);padding:4px 9px;font-size:10px;font-weight:700;white-space:nowrap}.device{display:flex;align-items:center;gap:5px}.nav-mask,#mobile-menu{display:none}.storage-warning{margin:12px 20px 0;padding:10px 14px;border-radius:9px;background:#f4dfa8;color:#392b1b}.content{width:100%;max-width:1480px;margin:0 auto;padding:26px clamp(15px,3vw,42px) 45px;outline:none}.page-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:0 0 20px}.page-heading p{margin-top:6px;max-width:740px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 11px;border-radius:9px;background:var(--paper);border:1px solid var(--line);color:var(--ink);font-size:12px;font-weight:700;white-space:nowrap}.button:hover:not(:disabled){background:var(--soft);border-color:var(--brass)}.button.primary{background:#325143;color:#fffaf0;border-color:#325143}.button.primary:hover:not(:disabled){background:#263f33}.icon-button{padding:0;width:34px;height:34px;min-height:34px;border-color:transparent;background:transparent}.text-link{display:inline-flex;align-items:center;gap:5px;color:var(--forest);font-weight:700;font-size:12px;white-space:nowrap}.text-link:hover{text-decoration:underline;text-underline-offset:3px}.period-select{display:flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--paper);border-radius:9px;white-space:nowrap}.period-select label{display:block}.period-select select{border:0;background:transparent;padding:7px 3px;font-weight:700;font-size:12px}

const pad=x=>String(x).padStart(2,'0');
const monthKey=(y,m)=>y+'-'+pad(m);
const dateKey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const DAY=86400000;
const instant=d=>Date.parse(d+'T00:00:00Z');
const addDays=(d,n)=>new Date(instant(d)+n*DAY).toISOString().slice(0,10);
const endDay=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const present=v=>v!==undefined&&v!==null&&v!=='';
const numeric=v=>present(v)&&Number.isFinite(Number(v));
const cents=n=>Math.sign(Number(n))*Math.round((Math.abs(Number(n))+1e-9)*100)||0;
const dollars=n=>n/100;
const monthDistance=(a,b)=>(Number(b.slice(0,4))-Number(a.slice(0,4)))*12+Number(b.slice(5,7))-Number(a.slice(5,7));
const uid=()=>globalThis.crypto?.randomUUID?.()??Date.now().toString(36)+Math.random().toString(36).slice(2);
const sum=(a,f)=>a.reduce((s,v)=>s+f(v),0);
const validDate=d=>typeof d==='string'&&/^20\d\d-\d\d-\d\d$|^2100-\d\d-\d\d$/.test(d)&&Number.isFinite(instant(d))&&addDays(d,0)===d;
const fold=v=>String(v??'').trim().toLowerCase();
const text=v=>String(v??'').trim();
const monthOf=d=>d?.slice(0,7)??'';

function makeDB(sample,specs,withData){
  const now=new Date();
  const settings={year:now.getFullYear(),month:now.getMonth()+1,currency:'USD',method:'Zero-based',extra:0,cash_floor:0,as_of:dateKey(now),household:'My Household',members:[],payday:1,warning:.8,theme:'light',...(withData?sample.settings:{})};
  const rows=Object.fromEntries(Object.keys(specs).map(n=>[n,withData?sample.rows[n].map(values=>({id:uid(),values:structuredClone(values)})):[]]));
  return {schema:1,edition:withData?'SAMPLE':'BLANK',settings,rows,categories:structuredClone(sample.categories),saving_plan:withData?structuredClone(sample.saving_plan):[]};
}

function paymentDate(anchor,frequency,y,m){
  if(!validDate(anchor))return null;
  const step={Monthly:1,Quarterly:3,Annual:12}[frequency];
  const elapsed=monthDistance(anchor,monthKey(y,m));
  return !step||elapsed<0||elapsed%step?null:monthKey(y,m)+'-'+pad(Math.min(Number(anchor.slice(8)),endDay(y,m)));
}

function payoff(loans,mode,monthlyExtra,asOf){
  const active=loans.filter(v=>text(v[0])&&Number(v[1])>0).slice(0,6);
  let balances=active.map(v=>cents(v[1]));
  const total=balances.reduce((a,b)=>a+b,0);
  const minimum=active.map(v=>Math.max(0,cents(v[3])));
  const rate=active.map(v=>Number(v[2])||0);
  let interest=0;
  const stages=[];
  for(let step=1;step<=180&&balances.some(Boolean);step++){
    const charged=balances.map((b,i)=>cents(dollars(b)*rate[i]/12));
    interest+=charged.reduce((a,b)=>a+b,0);
    const due=balances.map((b,i)=>b+charged[i]);
    const paid=due.map((d,i)=>Math.min(d,minimum[i]));
    const remaining=due.map((d,i)=>d-paid[i]);
    if(mode!=='Minimum'){
      let pool=cents(monthlyExtra)+sum(minimum,x=>x)-sum(paid,x=>x);
      const order=remaining.map((_,i)=>i).filter(i=>remaining[i]>0)
        .sort((a,b)=>(mode==='Snowball'?balances[a]-balances[b]:rate[b]-rate[a])||a-b);
      for(const i of order){const take=Math.min(pool,remaining[i]);remaining[i]-=take;pool-=take;paid[i]+=take;}
    }
    balances=remaining;
    const d=new Date(Date.UTC(Number(asOf.slice(0,4)),Number(asOf.slice(5,7))+step,0));
    stages.push({date:d.toISOString().slice(0,10),balance:sum(balances,x=>x),interest,charged:sum(charged,x=>x),paid:sum(paid,x=>x),charges:charged,balances:[...balances]});
  }
  const last=stages.at(-1);
  return {mode,total,months:last?.balance===0?stages.length:null,date:last?.balance===0?last.date:null,interest:last?.balance===0?interest:null,left:last?.balance??0,stages};
}

function calculate(db){
  const s=db.settings;
  const views=Object.fromEntries(Object.entries(db.rows).map(([n,list])=>[n,list.map(r=>({id:r.id,values:[...r.values]}))]));
  const accounts=new Map(),categories=new Map(db.categories.map(v=>[fold(v[0]),v]));
  for(const {values:v} of views.Accounts){
    const key=fold(v[0]);
    if(!key)continue;
    const item=accounts.get(key)??{label:text(v[0]),type:v[1],opening:cents(v[3]),count:0};
    item.count++;accounts.set(key,item);
  }
  const goodAccount=k=>accounts.get(k)?.count===1;
  const ledger=[],tx=[];
  const types=['Expense','Income','Transfer','Saving','Debt'];
  for(const row of views.Transactions){
    const v=row.values;
    const [date,account,desc,category,,amount,currency,rate,,kind,to,principal,rule]=v;
    const from=fold(account),dest=fold(to);
    const issue=!validDate(date)||!from||!numeric(amount)||!types.includes(kind)?'Missing date, account, amount or type':
      !goodAccount(from)?'Check account':
      (kind==='Transfer'&&!dest)||(dest&&(!['Transfer','Saving'].includes(kind)||dest===from||!goodAccount(dest)))?'Check receiving account':
      ['Transfer','Saving','Debt'].includes(kind)&&Number(amount)>=0?'Enter an outgoing amount':
      kind==='Expense'&&!categories.has(fold(category))?'Check category':
      kind==='Debt'&&numeric(principal)&&(Number(principal)<0||Number(principal)>Math.abs(amount))?'Check debt principal':
      currency&&currency!==s.currency&&(!numeric(rate)||Number(rate)<=0)?'FX rate needed':'';
    const fx=currency&&currency!==s.currency?Number(rate):1;
    const base=issue?null:cents(Number(amount)*fx),part=kind==='Debt'&&numeric(principal)&&!issue?cents(Number(principal)*fx):null;
    v[15]=base===null?null:dollars(base);v[16]=issue;v[17]=part===null?null:dollars(part);
    if(issue)continue;
    tx.push({id:row.id,date,from,category:fold(category),kind,base,principal:part??0,rule:fold(rule),desc});
    ledger.push({date,key:from,amount:base,side:'Source',id:row.id});
    if(dest)ledger.push({date,key:dest,amount:-base,side:'Receiving',id:row.id});
  }
  const first=s.year+'-01-01';
  const acctBalance=(key,through,inclusive=true)=>accounts.get(key).opening+sum(ledger.filter(x=>x.key===key&&x.date>=first&&(inclusive?x.date<=through:x.date<through)),x=>x.amount);
  for(const {values:v} of views.Accounts){
    const key=fold(v[0]);
    const issue=!key?'Enter account label':!goodAccount(key)?'Duplicate account':!v[1]?'Choose account type':'';
    v[4]=issue?null:dollars(acctBalance(key,s.as_of));v[5]=issue;
  }
  const groups=['Bills','Subscriptions','Recurring Income'];
  const counts=new Map(), occurrences=[];
  for(const n of groups)for(const {values:v} of views[n]){const k=fold(v[0]);if(k)counts.set(k,(counts.get(k)??0)+1);}
  for(const n of groups)for(const {id,values:v} of views[n]){
    const [code,name,account,amount,anchor,frequency]=v;
    const active=v[n==='Recurring Income'?6:7]==='Yes';
    const kind=n==='Recurring Income'?'Income':n==='Subscriptions'?'Expense':v[8];
    const k=fold(code), key=fold(account), schedule=[];
    if(active&&k&&counts.get(k)===1&&goodAccount(key)&&numeric(amount)&&Number(amount)>0&&['Income','Expense','Debt'].includes(kind)){
      for(let i=0;i<24;i++){
        const y=s.year+Math.floor(i/12),m=i%12+1,date=paymentDate(anchor,frequency,y,m);
        if(!date)continue;
        const expected=cents(amount);
        const matched=sum(tx.filter(t=>t.rule===k&&t.from===key&&t.kind===kind&&monthOf(t.date)===monthOf(date)),t=>t.base);
        const confirmed=Math.max(0,kind==='Income'?matched:-matched),open=Math.max(0,expected-confirmed);
        schedule.push({date,code,name,account,key,kind,expected,confirmed,open,group:n,id,cashDate:date<s.as_of?s.as_of:date});
      }
      occurrences.push(...schedule);
    }
    const next=schedule.find(x=>x.open>0)?.date;
    if(n==='Subscriptions')v[8]=active&&numeric(amount)&&frequency?dollars(cents(amount)*({Monthly:12,Quarterly:4,Annual:1}[frequency]??1)):null;
    if(n!=='Recurring Income'){
      v[9]=next??null;v[10]=!next?'':next<s.as_of?'Overdue':next<=addDays(s.as_of,7)?'Due in 7 days':'Upcoming';
    }
  }
  const budgetCount=new Map();
  for(const {values:v} of views['Monthly Budget']){
    const k=v[0]+'|'+fold(v[1]);budgetCount.set(k,(budgetCount.get(k)??0)+1);
  }
  for(const {values:v} of views['Monthly Budget']){
    const [date,category,plan]=v,key=fold(category);
    if(!validDate(date)||!key)continue;
    const spent=-sum(tx.filter(t=>t.kind==='Expense'&&t.category===key&&monthOf(t.date)===monthOf(date)),t=>t.base), planned=cents(plan);
    v[3]=dollars(spent);v[4]=numeric(plan)?dollars(planned-spent):null;v[5]=planned>0?Math.max(0,spent/planned):null;
    v[6]=budgetCount.get(date+'|'+key)>1?'Duplicate':date.slice(8)!=='01'?'Use first day':!numeric(plan)||planned<0?'Check plan':
      spent>planned?'Over budget':spent>planned*s.warning?'Near limit':'In budget';
    v[7]=categories.get(key)?.[1]??'';
  }
  for(const n of ['Savings Goals','Sinking Funds'])for(const {values:v} of views[n]){
    const [code,,target,date,saved]=v;
    if(!text(code))continue;
    const got=-sum(tx.filter(t=>t.kind==='Saving'&&t.rule===fold(code)&&t.date<=s.as_of),t=>t.base);
    v[5]=dollars(got);v[6]=Number(target)>0?Math.max(0,(cents(saved)+got)/cents(target)):null;
    v[7]=numeric(target)?dollars(Math.max(0,cents(target)-cents(saved)-got)):null;
    v[8]=v[7]!==null&&validDate(date)?dollars(Math.ceil(cents(v[7])/Math.max(1,monthDistance(s.as_of,date)))):null;
  }
  for(const {values:v} of views['Groceries & Meals']){
    if(!validDate(v[0]))continue;
    v[2]=dollars(-sum(tx.filter(t=>t.category==='groceries'&&t.kind==='Expense'&&t.date>=v[0]&&t.date<addDays(v[0],7)),t=>t.base));
    v[3]=numeric(v[1])?dollars(cents(v[1])-cents(v[2])):null;
  }
  for(const {values:v} of views.Maintenance)v[8]=!validDate(v[3])||v[6]==='Done'?'':v[3]<s.as_of?'Overdue':v[3]<=addDays(s.as_of,7)?'Due in 7 days':'Upcoming';
  const period=Array.from({length:12},(_,i)=>{
    const key=monthKey(s.year,i+1),next=i===11?monthKey(s.year+1,1):monthKey(s.year,i+2);
    const actual=tx.filter(t=>monthOf(t.date)===key), expected=occurrences.filter(t=>monthOf(t.date)===key);
    const cashOf=kind=>sum(actual.filter(t=>t.kind===kind),t=>t.base);
    const cat=Object.fromEntries(db.categories.map(([name])=>[name,-sum(actual.filter(t=>t.kind==='Expense'&&t.category===fold(name)),t=>t.base)]));
    const income=cashOf('Income'),expense=-cashOf('Expense'),saving=-cashOf('Saving'),debt=-cashOf('Debt'),principal=sum(actual,t=>t.principal);
    const plannedIncome=sum(expected.filter(t=>t.kind==='Income'),t=>t.expected);
    const plannedDebt=sum(expected.filter(t=>t.kind==='Debt'),t=>t.expected);
    const plannedExpense=sum(views['Monthly Budget'].filter(({values:v})=>v[0]===key+'-01'&&v[1]&&!['Duplicate','Use first day','Check plan'].includes(v[6])),({values:v})=>cents(v[2]));
    const plannedSaving=cents(db.saving_plan.find(v=>monthOf(v[0])===key)?.[1]??0);
    const categoryGroup=g=>sum(db.categories.filter(c=>c[1]===g),c=>cat[c[0]]);
    const accountValues=[...accounts.entries()].filter(([,a])=>a.count===1&&a.type).map(([k])=>acctBalance(k,next+'-01',false));
    const ext=views['Net Worth Inputs'].filter(({values:v})=>monthOf(v[0])===key);
    const assets=sum(accountValues,x=>Math.max(0,x))+sum(ext.filter(({values:v})=>v[2]==='Asset'),({values:v})=>cents(v[3]));
    const liabilities=sum(accountValues,x=>Math.max(0,-x))+sum(ext.filter(({values:v})=>v[2]==='Liability'),({values:v})=>cents(v[3]));
    const tax=sum(views['Tax & Documents'].filter(({values:v})=>monthOf(v[0])===key&&v[4]==='Yes'),({values:v})=>cents(v[3]));
    return {key,income,expense,saving,debt,principal,plannedIncome,plannedDebt,plannedExpense,plannedSaving,cat,assets,liabilities,worth:assets-liabilities,tax,
      remaining:income-expense-saving-debt,unassigned:plannedIncome-plannedExpense-plannedSaving-plannedDebt,rate:income>0?(saving+principal)/income:null,
      needs:categoryGroup('Needs'),wants:categoryGroup('Wants'),savingCategory:categoryGroup('Savings')};
  });
  const m=s.month,start=monthKey(s.year,m)+'-01';
  const checking=key=>accounts.get(key)?.count===1&&accounts.get(key)?.type==='Checking';
  const checkLedger=ledger.filter(r=>checking(r.key));
  const pending=occurrences.filter(r=>r.open>0&&checking(r.key)&&r.cashDate>=first);
  const impact=r=>r.kind==='Income'?r.open:-r.open;
  let balance=sum([...accounts.entries()].filter(([k])=>checking(k)),([,a])=>a.opening)+sum(checkLedger.filter(x=>x.date>=first&&x.date<start),x=>x.amount)+sum(pending.filter(x=>x.cashDate<start),impact);
  const cash=Array.from({length:endDay(s.year,m)},(_,i)=>{
    const date=addDays(start,i), list=checkLedger.filter(r=>r.date===date), due=pending.filter(r=>r.cashDate===date);
    const deposits=sum(list,r=>Math.max(0,r.amount)),withdrawals=sum(list,r=>Math.max(0,-r.amount));
    const inflow=sum(due.filter(r=>r.kind==='Income'),r=>r.open),outflow=sum(due.filter(r=>r.kind!=='Income'),r=>r.open);
    balance+=deposits-withdrawals+inflow-outflow;
    return {date,deposits,withdrawals,inflow,outflow,balance,alert:balance<cents(s.cash_floor),due};
  });
  return {views,tx,ledger,occurrences,period,cash,loans:['Avalanche','Snowball','Minimum'].map(n=>payoff(db.rows['Debt Inputs'].map(r=>r.values),n,s.extra,s.as_of))};
}


function readCSV(raw,delimiter){
  const source=raw.replace(/^\ufeff/,'');
  if(![';',',','\t'].includes(delimiter))throw Error('Choose a CSV separator.');
  const records=[];
  let row=[],field='',quoted=false,closed=false;
  for(let i=0;i<source.length;i++){
    const ch=source[i];
    if(quoted){
      if(ch==='"'&&source[i+1]==='"'){field+='"';i++;}
      else if(ch==='"'){quoted=false;closed=true;}
      else field+=ch;
    }else if(ch===delimiter||ch==='\n'||ch==='\r'){
      row.push(field);field='';closed=false;
      if(ch!==delimiter){if(row.some(v=>v.trim()))records.push(row);row=[];if(ch==='\r'&&source[i+1]==='\n')i++;}
    }else if(ch==='"'&&!field&&!closed)quoted=true;
    else{
      if(ch==='"'||closed)throw Error('Check the CSV separator and quotation marks.');
      field+=ch;
    }
  }
  if(quoted)throw Error('The CSV ends inside a quoted field.');
  if(field||row.length){row.push(field);if(row.some(v=>v.trim()))records.push(row);}
  return records;
}
function guessDelimiter(raw){
  return [',',';','\t'].map(d=>{try{const r=readCSV(raw,d);return [d,(r[0]?.length??0)*(r[0]?.length>1&&r.slice(1,6).every(v=>v.length===r[0].length)?3:1)];}catch{return [d,0];}}).sort((a,b)=>b[1]-a[1])[0][0];
}
function parseBankDate(value,format){
  const v=String(value??'').trim();
  const iso=/^(20\d{2}|2100)[-/](\d{1,2})[-/](\d{1,2})$/.exec(v);
  const pair=/^(\d{1,2})[-/.](\d{1,2})[-/.](20\d{2}|2100)$/.exec(v);
  const d=iso?iso[1]+'-'+pad(iso[2])+'-'+pad(iso[3]):pair&&format!=='ISO'?pair[3]+'-'+pad(pair[format==='DMY'?2:1])+'-'+pad(pair[format==='DMY'?1:2]):'';
  return validDate(d)?d:null;
}
function parseBankAmount(value,decimal){
  let v=String(value??'').trim().replace(/[\s\u00a0$£€¥]/g,'');
  if(!v)return null;
  const negative=v.startsWith('(')&&v.endsWith(')');
  if(negative)v=v.slice(1,-1);
  if(v.endsWith('-'))v='-'+v.slice(0,-1);
  const rule=decimal===','?/^[+-]?(?:\d{1,3}(?:\.\d{3})+|\d+)(?:,\d{1,4})?$/:/^[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d{1,4})?$/;
  if(!rule.test(v))return null;
  v=decimal===','?v.replaceAll('.','').replace(',','.'):v.replaceAll(',','');
  const n=Number(v);
  return numeric(n)&&Math.abs(n)<=99999999?n*(negative?-1:1):null;
}
function stageBank(rows,o,cats,currency){
  const get=(r,k)=>o[k]===''||o[k]===undefined?'':String(r[Number(o[k])]??'').trim();
  const catMap=new Map(cats.map(v=>[v[0].toLowerCase(),v[0]]));
  const fallback=o.fallback&&catMap.get(o.fallback.toLowerCase());
  return rows.map((r,i)=>{
    const date=parseBankDate(get(r,'date'),o.format);
    let amount=parseBankAmount(get(r,'amount'),o.decimal);
    if(o.amount===''){
      const debit=parseBankAmount(get(r,'debit'),o.decimal),credit=parseBankAmount(get(r,'credit'),o.decimal);
      amount=debit===null&&credit===null?null:Math.abs(credit??0)-Math.abs(debit??0);
    }else if(amount!==null&&o.reverse)amount=-amount;
    const description=get(r,'description')||'Imported transaction';
    const mapped=catMap.get(get(r,'category').toLowerCase());
    const type=amount<0?'Expense':o.positive==='Expense'?'Expense':'Income';
    const category=mapped??(type==='Expense'?fallback:null);
    const fx=get(r,'currency').toUpperCase()||currency;
    const issue=!date?'Invalid date':amount===null||amount===0?'Invalid or zero amount':type==='Expense'&&!category?'Choose a fallback category':!currencies.includes(fx)?'Unknown currency':'';
    const warning=fx!==currency?'FX rate needed':'';
    return {number:i+2,issue,warning,values:[date,o.account,description,category??null,null,amount,fx,null,null,type,null,null,null,null,null]};
  });
}

const groups=[

function choiceList(type,draft){
  if(type==='a')return draft.rows.Accounts.map(r=>r.values[0]).filter(Boolean);
  if(type==='c')return draft.categories.map(v=>v[0]);
  if(type==='k')return currencies;
  if(type==='y')return ['Yes','No'];
  return type.includes('/')?type.split('/'):[];
}
function cast(value,f){
  if(!present(value))return null;
  if(['m','p','f'].includes(f.type)){
    if(!numeric(value)||Math.abs(Number(value))>99999999||f.type==='p'&&(Number(value)<0||Number(value)>1)||f.type==='f'&&Number(value)<0)throw Error('Check '+f.label+'.');
    return Number(value);
  }
  if(typeof value!=='string'||value.length>5000)throw Error('Check '+f.label+'.');
  if(f.type==='d'&&!validDate(value))throw Error('Enter a valid '+f.label.toLowerCase()+'.');
  if(f.type==='k'&&!currencies.includes(value))throw Error('Select a supported currency.');
  if((f.type.includes('/')||f.type==='y')&&!choiceList(f.type,null).includes(value))throw Error('Choose a listed '+f.label.toLowerCase()+'.');
  return value.trim()||null;
}
function normalise(obj){
  if(obj?.schema!==1||!obj.settings||!obj.rows||!Array.isArray(obj.categories)||!Array.isArray(obj.saving_plan))throw Error('This is not a Home Atelier backup.');
  const s=obj.settings;
  if(!Number.isInteger(s.year)||s.year<2000||s.year>2099||!Number.isInteger(s.month)||s.month<1||s.month>12||!validDate(s.as_of)||
    !currencies.includes(s.currency)||!['Zero-based','50/30/20'].includes(s.method)||!['light','dark'].includes(s.theme)||typeof s.household!=='string'||!s.household.trim()||s.household.length>80||
    !Number.isFinite(s.extra)||s.extra<0||s.extra>99999999||!Number.isFinite(s.cash_floor)||!Number.isInteger(s.payday)||s.payday<1||s.payday>31||
    !Number.isFinite(s.warning)||s.warning<0||s.warning>1||!Array.isArray(s.members)||s.members.some(x=>typeof x!=='string'||x.length>80))throw Error('Check household settings.');
  const cats=new Set(), dates=new Set();
  const categories=obj.categories.map(v=>{
    if(!Array.isArray(v)||typeof v[0]!=='string'||!v[0].trim()||cats.has(fold(v[0]))||!['Needs','Wants','Savings'].includes(v[1])||!/^[\da-f]{6}$/i.test(v[2]))throw Error('Check category names, groups and colours.');
    cats.add(fold(v[0]));return [v[0].trim(),v[1],v[2].toUpperCase()];
  });
  const rows={};
  for(const [n,fs] of Object.entries(fields)){
    if(!Array.isArray(obj.rows[n])||obj.rows[n].length>25000)throw Error('Check the '+n+' register in this backup.');
    const seen=new Set();
    rows[n]=obj.rows[n].map(r=>{
      if(typeof r?.id!=='string'||seen.has(r.id)||!Array.isArray(r.values))throw Error('Duplicate or invalid record in '+n+'.');
      seen.add(r.id);
      const values=[];
      for(const f of fs)if(f.type!=='=')values[f.i]=cast(r.values[f.i],f);
      return {id:r.id,values};
    });
  }
  if(rows['Debt Inputs'].length>6)throw Error('The simulator supports up to six debts.');
  const saving_plan=obj.saving_plan.map(v=>{
    if(!Array.isArray(v)||!validDate(v[0])||!v[0].endsWith('-01')||dates.has(v[0])||!numeric(v[1])||Number(v[1])<0)throw Error('Check the saving plan.');
    dates.add(v[0]);return [v[0],Number(v[1])];
  });
  return {schema:1,edition:obj.edition==='SAMPLE'?'SAMPLE':'BLANK',settings:{...s},rows,categories,saving_plan};
}

function chart(data,series,{labels=months.map(x=>x.slice(0,3)),lines=false,title='Chart',formatter=money}={}){
  const W=640,H=244,left=63,right=16,top=18,bottom=205;
  const peak=Math.max(0,...data.flatMap(v=>series.map(s=>v[s.k]??0)));
  const trough=Math.min(0,...data.flatMap(v=>series.map(s=>v[s.k]??0)));
  const increment=Math.max(100,Math.ceil((peak-trough)/4/10000)*10000);
  const min=Math.floor(trough/increment)*increment,max=Math.max(increment,Math.ceil(peak/increment)*increment);
  const y=v=>bottom-(v-min)/(max-min)*(bottom-top);
  const unit=(W-left-right)/Math.max(1,data.length);
  const steps=Array.from({length:Math.round((max-min)/increment)+1},(_,i)=>min+i*increment);
  const axis=steps.map(v=>'<path d="M'+left+' '+y(v)+'H'+(W-right)+'" class="chart-grid"/><text x="'+(left-7)+'" y="'+(y(v)+4)+'" text-anchor="end">'+esc(Math.abs(v)>=100000?dollars(v/1000).toFixed(1).replace(/\.0$/,'')+'k':dollars(v))+'</text>').join('');
  const xLabels=data.map((d,i)=>labels[i]&&(!lines||data.length<=14||i%5===0)?'<text x="'+(left+unit*(i+.5))+'" y="'+(bottom+21)+'" text-anchor="middle">'+esc(labels[i])+'</text>':'').join('');
  const draw=series.map((s,j)=>{
    if(lines){
      const dots=data.map((d,i)=>[left+unit*(i+.5),y(d[s.k]??0),formatter(d[s.k]??0)]);
      return '<polyline fill="none" stroke="'+s.color+'" stroke-width="3" stroke-linejoin="round" points="'+dots.map(d=>d.slice(0,2).join(',')).join(' ')+'"/>'+
        dots.map(([x,yy,v],i)=>'<circle cx="'+x+'" cy="'+yy+'" r="3" fill="'+s.color+'"><title>'+esc((labels[i]??'')+' '+s.name+': '+v)+'</title></circle>').join('');
    }
    const bw=Math.min(15,(unit-8)/series.length);
    return data.map((d,i)=>{
      const v=d[s.k]??0,x=left+unit*(i+.5)+(j-series.length/2)*bw;
      return '<rect x="'+x+'" y="'+Math.min(y(v),y(0))+'" width="'+Math.max(2,bw-2)+'" height="'+Math.abs(y(v)-y(0))+'" fill="'+s.color+'" rx="2"><title>'+esc((labels[i]??'')+' '+s.name+': '+formatter(v))+'</title></rect>';
    }).join('');
  }).join('');
  return '<div class="chart"><svg role="img" aria-label="'+esc(title)+'" viewBox="0 0 '+W+' '+H+'">'+axis+xLabels+draw+'</svg></div><div class="legend">'+series.map(s=>'<span><i style="--swatch:'+s.color+'"></i>'+esc(s.name)+'</span>').join('')+'</div>';
}

function showValue(n,f,v,row){
  if(!present(v))return '<span class="muted">—</span>';
  if(f.type==='d'||f.label.startsWith('Next open'))return esc(dateLabel(v));
  if(f.type==='m'||cashColumns[n]?.includes(f.i)){
    const c=n==='Transactions'&&f.i===5?(row[6]||currency()):currency();
    return '<span class="amount '+(v<0?'negative':'')+'">'+esc(money(cents(v),c))+'</span>';
  }
  if(f.type==='p'||['Progress','Used'].includes(f.label))return esc(pct(v));
  if(statusFields.has(f.label))return status(v);
  if(f.type==='c'){
    const color=db.categories.find(r=>fold(r[0])===fold(v))?.[2]??'8FA58F';
    return '<span class="chip"><i style="--swatch:#'+color+'"></i>'+esc(v)+'</span>';
  }
  return esc(v);
}

function updateRow(n,values,id){
  const old=db.rows[n].find(r=>r.id===id);
  const rules=['Bills','Subscriptions','Recurring Income','Savings Goals','Sinking Funds'];
  const label=values[0];
  if(n==='Debt Inputs'&&!old&&db.rows[n].length>=6)throw Error('The simulator supports up to six debts.');
  if(n==='Accounts'){
    if(!label||!values[1])throw Error('Enter an account label and type.');
    if(db.rows[n].some(r=>r!==old&&fold(r.values[0])===fold(label)))throw Error('This account label already exists.');
    if(old&&old.values[0]!==label){
      const same=v=>fold(v)===fold(old.values[0]);
      for(const r of db.rows.Transactions){if(same(r.values[1]))r.values[1]=label;if(same(r.values[10]))r.values[10]=label;}
      for(const name of rules.slice(0,3))for(const r of db.rows[name])if(same(r.values[2]))r.values[2]=label;
    }
  }
  if(rules.includes(n)){
    const match=rules.some(name=>db.rows[name].some(r=>r!==old&&fold(r.values[0])===fold(label)));
    if(!label||!values[1]||match)throw Error('Enter a unique ID and a name.');
    if(old&&old.values[0]!==label)for(const r of db.rows.Transactions)if(fold(r.values[12])===fold(old.values[0]))r.values[12]=label;
  }
  if(n==='Monthly Budget'){
    if(!values[0]?.endsWith('-01')||!values[1]||!numeric(values[2])||values[2]<0)throw Error('Choose the first day of a month, category and planned amount.');
    if(db.rows[n].some(r=>r!==old&&r.values[0]===values[0]&&fold(r.values[1])===fold(values[1])))throw Error('This category already has a budget in that month.');
  }
  if(n==='Transactions'){
    if(!values[0]||!values[1]||!numeric(values[5])||!values[9])throw Error('Date, account, amount and type are required.');
    if(values[9]==='Expense'&&!values[3])throw Error('Choose an expense category.');
    if(values[9]==='Transfer'&&!values[10])throw Error('Choose a receiving account.');
    if(values[10]&&fold(values[10])===fold(values[1]))throw Error('Choose a different receiving account.');
    if(values[10]&&!['Transfer','Saving'].includes(values[9]))throw Error('Only transfers and savings can have a receiving account.');
    if(['Transfer','Saving','Debt'].includes(values[9])&&values[5]>=0)throw Error('Enter a negative outgoing amount.');
    if(values[9]==='Debt'&&numeric(values[11])&&(values[11]<0||values[11]>Math.abs(values[5])))throw Error('Principal must be between zero and the payment amount.');
  }
  if(!values.some(present))throw Error('Enter at least one value.');
  if(old)old.values=values;
  else db.rows[n].push({id:uid(),values});
}
function render(){
  document.querySelector('#atelier-header-status').textContent=atelierCloud?.isActive()?'Shared workspace':'On this device';
  document.documentElement.dataset.theme=db.settings.theme;
  document.querySelector('meta[name="theme-color"]').content=db.settings.theme==='dark'?'#1B1F23':'#F6F1E9';
  const n=current();
  document.title=(n==='Overview'?'Household overview':n)+' · The Home Atelier';
  document.body.classList.toggle('nav-open',navOpen);
  document.querySelector('#mobile-menu').setAttribute('aria-expanded',String(navOpen));
  document.querySelector('#crumb').textContent=n;
  document.querySelector('#sample-label').hidden=db.edition!=='SAMPLE';
  document.querySelector('#storage-warning').hidden=storageOK;
  nav.innerHTML=groups.map(([name,items])=>'<div class="nav-group"><p>'+name+'</p>'+items.map(([t,g])=>
    '<a href="'+href(t)+'" '+(t===n?'aria-current="page"':'')+'>'+icon(g,17)+'<span>'+t+'</span></a>').join('')+'</div>').join('');
  const pages={'Overview':overview,'Income':income,'Debt Payoff':debt,'Net Worth':networth,'Cash Flow Calendar':cash,'Year in Review':yearReview,'Account Ledger':ledger,'Settings':budgetSettings,'Help':help};
  content.innerHTML=Object.hasOwn(pages,n)?pages[n]():register(n);
}
function switchPage(){
  query='';sort='Recent first';scope='Selected month';page=0;navOpen=false;
  render();window.scrollTo(0,0);content.focus({preventScroll:true});
}
window.addEventListener('hashchange',switchPage);
dialog.addEventListener('cancel',e=>{if(dialog.dataset.closable==='false')e.preventDefault();});
dialog.addEventListener('close',()=>{pending=null;if(lastFocus?.isConnected)lastFocus.focus();});
function setMonth(m){
  if(m<1||m>12)return;
  db.settings.month=m;page=0;save();
}
function welcome(){
  modal('Set up your household','Choose how to start The Home Atelier.',
    '<div class="welcome"><button type="button" data-action="welcome-sample">'+icon('chart',23)+'<b>Explore sample data</b><small>See a fictional household with transactions, bills and debts.</small></button>'+
    '<button type="button" data-action="welcome-blank">'+icon('home',23)+'<b>Start blank</b><small>Set up your accounts and your own budget.</small></button><button type="button" id="atelier-welcome-login"><strong>Sign in or create account</strong><small>Open a shared workspace or sync across devices.</small></button></div>',false);
}
function actionClick(e){
  const link=e.target.closest('nav a');
  if(link&&navOpen&&link.hash===location.hash){navOpen=false;render();return;}
  const target=e.target.closest('[data-action]');
  if(!target)return;
  const a=target.dataset.action,n=current(),i=Number(target.dataset.index);
  if(a==='skip'){e.preventDefault();content.focus();return;}
  if(a==='menu'||a==='close-menu'){navOpen=a==='menu'&&!navOpen;render();return;}
  if(a==='prev-month'||a==='next-month'){setMonth(db.settings.month+(a==='prev-month'?-1:1));return;}
  if(a==='previous-page'||a==='next-page'){page+=a==='previous-page'?-1:1;document.querySelector('#results').innerHTML=tableResults(n);return;}
  if(a==='close'){dialog.close();return;}
  if(a==='hide-toast'){document.querySelector('#toast').hidden=true;return;}
  if(a==='confirm'){const fn=pending;pending=null;dialog.close();fn?.();return;}
  if(a==='welcome-sample'||a==='welcome-blank'){dialog.close();reset(makeDB(sample,specs,a==='welcome-sample'));return;}
  if(a==='sample'||a==='clear'){
    const show=a==='sample';
    confirmation(show?'Load the example household?':'Clear household data?','This replaces the records and settings currently stored in this browser.',show?'Load sample':'Clear planner',()=>{
      reset(makeDB(sample,specs,show));toast(show?'Sample data loaded.':'Planner cleared.');
    });return;
  }
  if(a==='quick'){quick();return;}
  if(a==='quick-account'){rowModal('Accounts');return;}
  if(a==='detailed'){
    const f=Object.fromEntries(new FormData(document.querySelector('#quick-form')));
    const raw=Number(f.amount),kind=f.kind==='Refund'?'Expense':f.kind;
    rowModal('Transactions',null,[f.date,f.account,f.desc,f.category,null,present(f.amount)?raw*(['Refund','Income'].includes(f.kind)?1:-1):null,currency(),null,null,kind,f.to]);return;
  }
  if(a==='add'){rowModal(n);return;}
  if(a==='category-add'){categoryModal();return;}
  if(a==='category-edit'){categoryModal(i);return;}
  if(a==='category-remove'){
    const cat=db.categories[i]?.[0];
    const used=['Transactions','Monthly Budget','Tax & Documents'].some((k,j)=>db.rows[k].some(r=>fold(r.values[[3,1,2][j]])===fold(cat)));
    if(used){toast('Reassign records using this category before deleting it.');return;}
    confirmation('Delete category?','Remove '+cat+' from your category list.','Delete category',()=>{db.categories.splice(i,1);save();toast('Category deleted.');});return;
  }
  if(a==='backup'){download('home-atelier-backup.json',JSON.stringify(db,null,2));return;}
  if(a==='restore'){filePick('json');return;}
  if(a==='bank-csv'){
    if(!db.rows.Accounts.length){toast('Add an account before importing transactions.');return;}
    filePick('bank');return;
  }
  if(a==='bank-back'){bankMapping(bank.options);return;}
  if(a==='bank-save'){
    const rows=bank.staged;if(!rows?.length)return;
    db.rows.Transactions.push(...rows.map(({values})=>({id:uid(),values})));
    scope='All records';query='';page=0;dialog.close();bank=null;save();toast(rows.length+' transactions imported.');return;
  }
  if(a==='saving-plan'||a==='debt-extra'){
    const b=a==='saving-plan';
    modal(b?'Edit saving plan':'Monthly debt extra',b?monthLabel():'Added to the combined minimum payments.',
      '<form id="number-form" data-kind="'+a+'">'+input('Amount ('+currency()+')','amount',b?dollars(selected().plannedSaving):db.settings.extra,'number','required min="0" max="99999999" step="0.01"')+formError+actions('Save amount')+'</form>');return;
  }
  if(a==='print'){window.print();return;}
  if(a==='cash-detail'){
    const d=model.cash.find(v=>v.date===target.dataset.date);
    const vals=[['Actual deposits',d.deposits],['Actual withdrawals',d.withdrawals],['Expected inflow',d.inflow],['Expected outflow',d.outflow],['Projected closing',d.balance]];
    modal(dateLabel(d.date),'Checking cash flow','<dl class="totals">'+vals.map(([k,v])=>'<div><dt>'+k+'</dt><dd>'+esc(money(v))+'</dd></div>').join('')+'</dl>'+
      (d.due.length?'<div class="list-items">'+d.due.map(r=>'<div><span class="category-icon">'+icon('bill')+'</span><div><b>'+esc(r.name||r.code)+'</b><small>'+esc(r.group)+'</small></div><strong>'+esc(money(r.open))+'</strong></div>').join('')+'</div>':'')+
      '<div class="form-actions">'+btn('Close','close')+'</div>');return;
  }
  if(a==='confirm-rule'){
    const r=model.occurrences.find(x=>x.id===target.dataset.rule&&x.date===target.dataset.date&&x.group===n);
    if(r)rowModal('Transactions',null,[r.date,r.account,r.name,r.kind==='Expense'?(db.categories.find(v=>v[0]==='Other')?.[0]??null):null,null,dollars(r.open)*(r.kind==='Income'?1:-1),currency(),null,null,r.kind,null,null,r.code]);return;
  }
  if(a==='undo'){
    if(undo){db.rows[undo.n].splice(undo.i,0,undo.record);undo=null;save();toast('Record restored.');}
    return;
  }
  const index=db.rows[n]?.findIndex(r=>r.id===target.dataset.row)??-1;
  if(index<0)return;
  const record=db.rows[n][index];
  if(a==='edit'){rowModal(n,record);return;}
  if(a==='remove'){
    if(n==='Accounts'){
      const k=fold(record.values[0]);
      if(db.rows.Transactions.some(r=>[r.values[1],r.values[10]].some(v=>fold(v)===k))||['Bills','Subscriptions','Recurring Income'].some(s=>db.rows[s].some(r=>fold(r.values[2])===k))){
        toast('Reassign linked transactions and recurring rules before deleting this account.');return;
      }
    }
    confirmation('Delete this record?','You can restore it immediately using Undo.','Delete record',()=>{
      db.rows[n].splice(index,1);undo={n,i:index,record};save();toast('Record deleted.',true);
    });
  }
}
document.addEventListener('click',actionClick);
document.addEventListener('input',e=>{
  if(e.target.id==='search'){query=e.target.value;page=0;document.querySelector('#results').innerHTML=tableResults(current());}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='report-month'){setMonth(Number(t.value));return;}
  if(t.id==='scope'||t.id==='sort'){
    if(t.id==='scope')scope=t.value;else sort=t.value;
    page=0;document.querySelector('#results').innerHTML=tableResults(current());return;
  }
  if(t.name==='kind'&&t.form?.id==='quick-form'){
    document.querySelector('#quick-to').hidden=!['Transfer','Saving'].includes(t.value);return;
  }
  if(t.name==='delimiter'&&t.form?.id==='bank-form'){
    try{bankMapping({delimiter:t.value});}catch(error){displayError(t.form,error);}return;
  }
});
function displayError(form,error){
  const p=form.querySelector('.form-error');
  if(p){p.textContent=error.message;p.hidden=false;}
  else toast(error.message);
}
document.addEventListener('submit',e=>{
  const f=e.target,id=f.id;
  if(!['settings-form','category-form','record-form','quick-form','bank-form','number-form'].includes(id))return;
  e.preventDefault();
  const data=Object.fromEntries(new FormData(f));
  try{
    if(id==='bank-form'){previewBank({...data,reverse:data.reverse==='on'});return;}
    if(id==='settings-form'){
      const settings={...db.settings,...data,year:Number(data.year),month:Number(data.month),extra:Number(data.extra),cash_floor:Number(data.cash_floor),
        payday:Number(data.payday),warning:Number(data.warning)/100,household:data.household.trim(),members:data.members.split(',').map(x=>x.trim()).filter(Boolean)};
      db=normalise({...db,settings});save();toast('Settings saved.');return;
    }
    if(id==='category-form'){
      const i=f.dataset.index===''?null:Number(f.dataset.index),label=data.name.trim();
      if(!label||db.categories.some((v,j)=>j!==i&&fold(v[0])===fold(label)))throw Error('Choose a unique category name.');
      if(i!==null&&db.categories[i][0]!==label){
        const old=fold(db.categories[i][0]);
        for(const [n,c] of [['Transactions',3],['Monthly Budget',1],['Tax & Documents',2]])for(const r of db.rows[n])if(fold(r.values[c])===old)r.values[c]=label;
      }
      const values=[label,data.group,data.color.slice(1).toUpperCase()];
      if(i===null)db.categories.push(values);else db.categories[i]=values;
    }
    if(id==='number-form'){
      if(f.dataset.kind==='debt-extra')db.settings.extra=Number(data.amount);
      else{
        const date=selected().key+'-01',i=db.saving_plan.findIndex(v=>v[0]===date);
        if(i<0)db.saving_plan.push([date,Number(data.amount)]);else db.saving_plan[i][1]=Number(data.amount);
      }
    }
    if(id==='quick-form'){
      const kind=data.kind==='Refund'?'Expense':data.kind;
      const amount=Number(data.amount)*(['Refund','Income'].includes(data.kind)?1:-1);
      const category=kind==='Expense'?data.category:null,to=['Transfer','Saving'].includes(kind)?data.to:null;
      updateRow('Transactions',[data.date,data.account,data.desc?.trim()||category||data.kind,category,null,amount,currency(),null,null,kind,to],null);
      if(current()==='Transactions'&&!data.date.startsWith(selected().key)){scope='All records';page=0;}
      try{localStorage.setItem('home-atelier.last-account',data.account);}catch{}
    }
    if(id==='record-form'){
      const n=f.dataset.module,v=[];
      for(const item of fields[n])if(item.type!=='='){
        const value=data['f'+item.i];
        v[item.i]=cast(item.type==='p'&&present(value)?Number(value)/100:value,item);
      }
      updateRow(n,v,f.dataset.id);
      if(current()==='Transactions'&&!v[0].startsWith(selected().key)){scope='All records';page=0;}
    }
    dialog.close();save();
    toast(id==='quick-form'?'Transaction saved.':id==='record-form'?'Record saved.':id==='category-form'?'Category saved.':'Amount saved.');
  }catch(error){displayError(f,error);}
});
file.addEventListener('change',async()=>{
  const entry=file.files[0];if(!entry)return;
  try{
    if(entry.size>8_000_000)throw Error('Choose a file smaller than 8 MB.');
    const raw=await entry.text();
    if(file.dataset.kind==='bank'){bank={raw,name:entry.name};bankMapping();return;}
    const next=normalise(JSON.parse(raw.replace(/^\ufeff/,'')));
    confirmation('Restore this backup?','The backup replaces the records and settings in this browser.','Restore backup',()=>{reset(next);toast('Backup restored.');});
  }catch(error){toast(error.message||'Could not read the file.');}
});

const cloudPanel=document.querySelector('#atelier-cloud-panel');
const cloudLauncher=document.querySelector('#atelier-cloud-open');
cloudLauncher.addEventListener('click',()=>cloudPanel.showModal());
dialog.addEventListener('click', event=>{
  if(!event.target.closest('#atelier-welcome-login'))return;
  dialog.close();
  cloudPanel.showModal();
});

document.querySelector('#atelier-cloud-close').addEventListener('click',()=>cloudPanel.close());
cloudPanel.querySelector('[role=status]').textContent='Connecting to Firebase…';
cloudPanel.querySelector('#atelier-auth').hidden=true;
let atelierCloud;
import('./atelier-cloud.js').then(({installCloud})=>{
  atelierCloud=installCloud({
    key:DATA_KEY,
    read:()=>JSON.stringify(db),
    empty:()=>JSON.stringify(makeDB(sample,specs,false)),
    canApply:()=>!dialog.open,
    apply(payload){
      const next=normalise(JSON.parse(payload));
      if(dialog.open)dialog.close();
      undo=null;
      db=next;
      model=calculate(db);
      render();
    },
  });
}).catch(()=>{
  cloudPanel.querySelector('[role=status]').textContent='Firebase could not load. Check your connection and reload this page.';
});
render();
if(firstRun)welcome();
if('serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    const status=document.querySelector('#offline-ready');if(status)status.hidden=!navigator.serviceWorker.controller;
  });
}

</script></body></html>
